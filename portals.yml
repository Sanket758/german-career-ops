    query: 'site:xing.com/jobs "Machine Learning" OR "ML Engineer" OR "AI Engineer" "Vollzeit" OR "full-time" Berlin'
    enabled: true

  - name: XING — ML/AI Engineer Berlin (PRIORITY)
    query: 'site:xing.com/jobs "Machine Learning" OR "ML Engineer" OR "AI Engineer" "Berlin"'
    enabled: true

  - name: XING — Computer Vision Berlin (PRIORITY)
