# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Location Priority --
# TIER 1 (PRIMARY): German priority cities
# TIER 2 (SECONDARY): International relocation targets
# TIER 3 (RELOCATE): Asia/Remote/Other EU if good fit

location_priority:
  tier1:
    - Berlin
    - Munich
    - Bavaria
    - Dusseldorf
    - Dortmund
    - Essen
  tier2:
    - Luxembourg
    - Switzerland
    - UK
    - Belgium
    - Poland
    - Netherlands
  tier3:
    - Seoul
    - South Korea
    - Japan
    - remote
    - Europe
    - EU

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- AI/ML core roles (Sanket's primary targets) --
    - "AI"
    - "ML"
    - "Machine Learning"
    - "Deep Learning"
    - "LLM"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    # -- Computer Vision (strongest fit) --
    - "Computer Vision"
    - "Vision"
    - "Perception"
    - "Object Detection"
    - "Image"
    # -- Robotics --
    - "Robotics"
    - "ROS"
    - "Autonomous"
    - "Edge"
    # -- Python/Backend --
    - "Python"
    - "Data Engineer"
    - "Data Scientist"
    # -- RAG & Agents --
    - "Agent"
    - "Agentic"
    - "RAG"
    - "Retrieval"
    # -- German AI/ML keywords (DACH market) --
    - "KI"
    - "Künstliche Intelligenz"
    - "KI Engineer"
  negative:
    # Exclude non-matching tech stacks and roles
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Product Manager"
    - "DevRel"
    - "Developer Advocate"
    - "Marketing"
    - "Sales"
    - "Recruiter"
    # CODE RED 2026-08-05 — block business/GTM/leadership noise that matches 'AI'/'ML'
    - "Account Executive"
    - "Account Manager"
    - "Customer Success"
    - "Solutions Consultant"
    - "Solutions Consulting"
    - "GTM"
    - "Talent Pool"
    - "Business Development"
    - "Head of"
    - "Growth"
    - "Paid Social"
    - "SEO"
    - "Content"
    - "Partnerships"
    - "Business Intelligence"
    - "General Ledger"
    - "Accountant"
    - "Kitchen"
    - "Shift Lead"
    - "Maintenance"
    - "Supply Chain"
    - "Supervisor"
    - "Mechanical Engineer"
    - "Systems Engineer"
    - "Safety"
    - "Frontend"
    - "Backend Engineer"
    # CODE RED 2026-08-05 — full-time ONLY. Auto-discard all part-time/student roles.
    - "Werkstudent"
    - "Working Student"
    - "Praktikum"
    - "Internship"
    - "Intern "
    - "Thesis"
    - "Bachelor"
    - "Master Thesis"
    - "Working Student"
    - "Hiwi"
    - "Student Assistant"
    - "Student Employee"
    - "Part-time"
    - "Part Time"
    - "20h"
    - "15h"
    - "Seasonal"
    - "Apprentice"
    - "Azubi"
  seniority_boost:
    # CODE RED — boost junior/mid (Sanket open to & prefers junior). No penalty for senior.
    - "Junior"
    - "Mid"
    - "Entry"
    - "Graduate"
    - "Senior"
    - "Lead"
    - "Staff"

# -- Location filter --
# Filters out jobs outside your target regions to save pipeline space.
# Uses case-insensitive substring matching on the 'location' string from APIs.
location_filter:
  positive:
    - Remote
    - Germany
    - Deutschland
    - Berlin
    - Munich
    - München
    - Regional
    - Leipzig
    - Brandenburg
    - Dresden
    - Stuttgart
    - Bavaria
    - Bayern
    - Dusseldorf
    - Cologne
    - Hamburg
    - Hanover
    - Nuremberg
    - Essen
    - Frankfurt
    - Mainz
    - Karlsruhe
    - Freiburg
    - Heidelberg
    - Aachen
    - Bochum
    - Dortmund
    - Magdeburg
    - Jena
    - Erlangen
    - Ulm
    - Europe
    - EU
    - Belgium
    - Poland
    - Netherlands
    - Seoul
    - South Korea
    - Japan
  negative:
    - United States
    - US
    - USA
    - Canada
    - Spain
    - France
    - Italy
    - Australia
    - Philippines
    - Brazil
    - Chile
    - India
    - UAE
    - Dubai
    - Singapore

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.
# Customized for Sanket Gadge: CV/ML Engineer, full-time only, Germany-wide (CODE RED 2026-08-05).

search_queries:

  # ============================================
  # TIER 1: BERLIN + NEARBY (PRIMARY)
  # ============================================

  # -- LinkedIn Berlin/Nearby — Werkstudent (HIGHEST PRIORITY) --
  - name: LinkedIn — Full-time AI/ML Berlin (CODE RED)
    query: 'site:linkedin.com/jobs "AI" OR "ML" OR "Machine Learning" OR "Computer Vision" "full-time" Berlin junior OR associate'
    enabled: true

  - name: LinkedIn — Full-time Computer Vision Berlin (CODE RED)
    query: 'site:linkedin.com/jobs "Computer Vision" OR "Machine Learning Engineer" "full-time" Berlin 2026'
    enabled: true

  - name: LinkedIn — ML CV near Berlin (CODE RED)
    query: 'site:linkedin.com/jobs "AI" OR "ML" OR "ML Engineer" "full-time" Leipzig OR Brandenburg OR Potsdam OR Dresden senior OR junior'
    enabled: true

  # -- LinkedIn Berlin — Full-time/Part-time AI/ML --
  - name: LinkedIn — ML Engineer Berlin (PRIORITY)
    query: 'site:linkedin.com/jobs "ML Engineer" OR "Machine Learning Engineer" OR "AI Engineer" Berlin'
    enabled: true

  - name: LinkedIn — Computer Vision Berlin (PRIORITY)
    query: 'site:linkedin.com/jobs "Computer Vision" OR "CV Engineer" OR "Perception" OR "Object Detection" Berlin'
    enabled: true

  - name: LinkedIn — Python AI Developer Berlin (PRIORITY)
    query: 'site:linkedin.com/jobs "Python" "AI" OR "ML" "Developer" OR "Engineer" Berlin'
    enabled: true

  - name: LinkedIn — Robotics ML Berlin (PRIORITY)
    query: 'site:linkedin.com/jobs "Robotics" "ML" OR "Machine Learning" OR "Computer Vision" OR "ROS" Berlin'
    enabled: true

  # -- XING Berlin/Nearby (major German job board) --
