# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Location Priority --
# TIER 1 (PRIMARY): German priority cities
# TIER 2 (SECONDARY): International relocation targets
# TIER 3 (RELOCATE): Asia/Remote/Other EU if good fit

location_priority:
  tier1:
    - Berlin
    - Munich
    - Bavaria
    - Dusseldorf
    - Dortmund
    - Essen
  tier2:
    - Luxembourg
    - Switzerland
    - UK
    - Belgium
    - Poland
    - Netherlands
  tier3:
    - Seoul
    - South Korea
    - Japan
    - remote
    - Europe
    - EU

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- AI/ML core roles (Sanket's primary targets) --
    - "AI"
    - "ML"
    - "Machine Learning"
    - "Deep Learning"
    - "LLM"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    # -- Computer Vision (strongest fit) --
    - "Computer Vision"
    - "Vision"
    - "Perception"
    - "Object Detection"
    - "Image"
    # -- Robotics --
    - "Robotics"
    - "ROS"
    - "ROS2"
    - "ROS 2"
    - "TurtleBot3"
    - "Autonomous"
    - "Edge"
    - "Robotik"
    - "SLAM"
    - "Motion Planning"
    - "Manipulation"
    # -- Python/Backend --
    - "Python"
    - "Data Engineer"
    - "Data Scientist"
    # -- RAG & Agents --
    - "Agent"
    - "Agentic"
    - "RAG"
    - "Retrieval"
    # -- German AI/ML keywords (DACH market) --
    - "KI"
    - "Künstliche Intelligenz"
    - "KI Engineer"
    # -- Software developer roles (2026-10-20: Berlin AI/retail sweep) --
    # Strict match: the title must literally say Software / Developer.
    - "Software Engineer"
    - "Software Developer"
    - "Developer"
    - "Software"
  negative:
    # Exclude non-matching tech stacks and roles
    - ".NET"
    - "Java "
    - "HTML"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP Consultant"
    - "SAP Basis"
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Product Manager"
    - "DevRel"
    - "Developer Advocate"
    - "Marketing"
    - "Sales"
    - "Recruiter"
    # CODE RED 2026-08-05 — block business/GTM/leadership noise that matches 'AI'/'ML'
    - "Account Executive"
    - "Account Manager"
    - "Customer Success"
    - "Solutions Consultant"
    - "Solutions Consulting"
    - "GTM"
    - "Talent Pool"
    - "Business Development"
    - "Head of"
    - "Growth"
    - "Paid Social"
    - "SEO"
    - "Content"
    - "Partnerships"
    - "Business Intelligence"
    - "General Ledger"
    - "Accountant"
    - "Kitchen"
    - "Shift Lead"
    - "Maintenance"
    - "Supply Chain"
    # 2026-10-20: logistics + backend are out of scope for the daily scan.
    # NOTE: "Warehouse" is deliberately NOT excluded — warehouse computer
    # vision is inside the target area (shelf / picking / forklift vision).
    - "Logistics"
    - "Logistik"
    - "Backend"
    - "Supervisor"
    - "Mechanical Engineer"
    - "Systems Engineer"
    - "Safety"
    - "Frontend"
    - "Backend Engineer"
    # CODE RED 2026-08-05 — full-time ONLY. Auto-discard all part-time/student roles.
    - "Werkstudent"
    - "Working Student"
    - "Praktikum"
    - "Internship"
    - "Intern "
    - "Thesis"
    - "Bachelor"
    - "Master Thesis"
    - "Working Student"
    - "Hiwi"
    - "Student Assistant"
    - "Student Employee"
    - "Part-time"
    - "Part Time"
    - "20h"
    - "15h"
    - "Seasonal"
    - "Apprentice"
    - "Azubi"
  seniority_boost:
    # CODE RED — boost junior/mid (Sanket open to & prefers junior). No penalty for senior.
    - "Junior"
    - "Mid"
    - "Entry"
    - "Graduate"
    - "Senior"
    - "Lead"
    - "Staff"

# -- Location filter --
# Filters out jobs outside your target regions to save pipeline space.
# Uses case-insensitive substring matching on the 'location' string from APIs.
location_filter:
  positive:
    - Remote
    - Germany
    - Deutschland
    - Berlin
    - Munich
    - München
    - Regional
    - Leipzig
    - Brandenburg
    - Dresden
    - Stuttgart
    - Bavaria
    - Bayern
    - Dusseldorf
    - Cologne
    - Hamburg
    - Hanover
    - Nuremberg
    - Essen
    - Frankfurt
    - Mainz
    - Karlsruhe
    - Freiburg
    - Heidelberg
    - Aachen
    - Bochum
    - Dortmund
    - Magdeburg
    - Jena
    - Erlangen
    - Ulm
    - Europe
    - EU
    - Belgium
    - Poland
    - Netherlands
    - Seoul
    - South Korea
    - Japan
  negative:
    - United States
    - US
    - USA
    - Canada
    - Spain
    - France
    - Italy
    - Australia
    - Philippines
    - Brazil
    - Chile
    - India
    - UAE
    - Dubai
    - Singapore

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.
# Customized for Sanket Gadge: CV/ML Engineer, full-time only, Germany-wide (CODE RED 2026-08-05).

